    --art-sheen-opacity: 0.18;
    --art-shadow: #000000;
    --art-shadow-opacity: 0.28;
    --art-muted-line: #64748b;
    --art-panel-tint: #1e293b;
    --accent-1: #fbbf24;
    --accent-2: #fb923c;
    --accent-3: #f87171;
    --accent-4: #a3e635;
    --accent-5: #4ade80;
    --accent-6: #d4a574;
}
:root[data-theme="light"] {
    --background: #f8fafc;
    --panel: #ffffff;
    --primary-text: #0f172a;
    --muted-text: #64748b;
    --inverse-text: #ffffff;
